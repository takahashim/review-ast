# Re:VIEW 要素と Typst 出力の対応表
#
# 設計文書(doc/design-typst.md)が求める対応表であり、その
# 「未対応要素を黙って落とさない」という要求を検査可能な形にしたもの。test/ast/test_typst_element_coverage.rb が
# この表とコンパイラの命令表・レンダラの定義メソッドを機械的に突き合わせる。
#
# これはテストのフィクスチャではなく契約である。表が正で実装が従なので、
# テストを通すために書き換えてよいものではない。表を変えることは仕様を
# 変えることを意味する。schema/ に置いてあるのはそのため
# (ast-format-1.schema.json も、読むのはテストだけだが同じ性格を持つ)。
#
# status:
#   render  出力する(出力位置が定義位置と異なる場合は note に記す)
#   ignore  出力しないと決めた要素。reason 必須
#   lowered directive lowering で描画前に消えるため、レンダラに対応メソッドはない
#
# この表に無い命令、または表にあってメソッドが無い命令があるとテストが落ちる。

blocks:
  list:
    node: CodeBlockNode
    renderer: visit_code_block_list
    typst: review.listing
    status: render

  listnum:
    node: CodeBlockNode
    renderer: visit_code_block_listnum
    typst: review.listing
    status: render

  emlist:
