    renderer: visit_list_item
    typst: (list item)
    status: render
    note: ul/ol の項目。visit_list が項目ごとに描画する

  dt:
    node: ListItemNode
    renderer: visit_list
    typst: (description-list item)
    status: render
    note: dl の見出し。visit_list が description-list として描画する

  dd:
