name: nightly

# Deeper verification than a pull request should wait for.
#
# The pull-request suite runs the property-based generator over 30 fixed seeds
# (test/ast/test_pbt_round_trip_identity.rb). That is a self-consistency check:
# a reloaded tree must render like a fresh one. What runs here instead is the
# generator against the *legacy builders*, over far more seeds -- the oracle
# comparison, which is where real divergences turn up but which costs more than
# a PR should pay.
#
# None of the modes needs TeX or any external document, so this depends on
# nothing outside the repository.

on:
  schedule:
    # 18:00 UTC daily (03:00 JST).
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: Number of generated documents to check
        required: false
        default: '500'

jobs:
  pbt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # canonical is LaTeX without TeX (a whitespace-normalized text diff);
        # html compares under the CSS white-space model, idgxml byte for byte,
        # plaintext and top by non-blank lines.
        mode: [canonical, html, idgxml, plaintext, top]
        # The book settings that changed the most output when first swept:
        # Re:VIEW 2's older macros and English quotes. '' is the default.
        config: ['', 'review_version=2.0', 'language=en']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Compare generated documents against the legacy builders
        env:
          PBT_CONFIG: ${{ matrix.config }}
        run: |
          bundle exec ruby tools/pbt/runner.rb \
            --mode ${{ matrix.mode }} \
            --seeds ${{ github.event.inputs.seeds || 500 }} \
            ${PBT_CONFIG:+--config "$PBT_CONFIG"}

  # The test suite against Re:VIEW's master branch instead of the released gem.
  # review-ast subclasses Re:VIEW's makers and relies on their internals, and
  # its parity tests use Re:VIEW's builders as the oracle, so an upstream change
  # shows up here before it is released: either review-ast has to follow, or
  # the change is a regression worth reporting upstream. (Re:VIEW master moved
  # @<em> in TOP output and the part-file read path this way.)
  review-head:
    runs-on: ubuntu-latest
    env:
      REVIEW_HEAD: master
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Show the Re:VIEW revision under test
        run: bundle exec ruby -e 'spec = Gem.loaded_specs["review"]; puts "#{spec.version} #{spec.source}"'
      - run: bundle exec rake test
